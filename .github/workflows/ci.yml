name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'wiki/**'
      - 'MEDIA/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (PowerShell 7)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runtime
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          [System.Environment]::OSVersion.VersionString

      - name: Syntax parse gate
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $path = Join-Path $PWD 'RDP-Tool.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("L{0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          Write-Host "Parse OK ($($tokens.Count) tokens)."

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: PSScriptAnalyzer gate (project settings)
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $findings = @(Invoke-ScriptAnalyzer -Path ./RDP-Tool.ps1 -Settings ./ScriptAnalyzerSettings.psd1)
          if ($findings.Count -gt 0) {
            $findings | ForEach-Object {
              Write-Host ("L{0} [{1}] {2}: {3}" -f $_.Line, $_.Severity, $_.RuleName, $_.Message)
            }
            Write-Error "PSScriptAnalyzer found $($findings.Count) issue(s)."
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: clean.'

      - name: Pester test suite
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          $conf = New-PesterConfiguration
          $conf.Run.Path = './tests'
          $conf.Run.PassThru = $true
          $conf.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $conf
          if ($result.FailedCount -gt 0 -or $result.Result -ne 'Passed') { exit 1 }

  cross-platform-parse:
    name: Parse gate (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse + logic tests (platform-independent subset)
        shell: pwsh
        run: |
          $errors = $null; $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/RDP-Tool.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "Parse OK on Linux runner."
